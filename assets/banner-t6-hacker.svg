<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%">
  <defs>
    <pattern id="scan6" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.5"/>
    </pattern>
    <filter id="glow6"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="#080808"/>
  <rect width="100%" height="100%" fill="url(#scan6)"/>

  <g font-family="monospace" font-size="8" fill="#0f0" opacity="0.04" text-anchor="start">
    <text x="20" y="0"><animate attributeName="y" values="-20;300" dur="3s" repeatCount="indefinite"/>0xDEADBEEFCAFEBABE...</text>
    <text x="20" y="15"><animate attributeName="y" values="-20;300" dur="4s" repeatCount="indefinite" begin="0.5s"/>0x1337C0DE900DFACE...</text>
    <text x="20" y="30"><animate attributeName="y" values="-20;300" dur="3.5s" repeatCount="indefinite" begin="1s"/>0xA1B2C3D4E5F6789A...</text>
    <text x="620" y="0"><animate attributeName="y" values="-20;300" dur="5s" repeatCount="indefinite" begin="1.5s"/>0xBADF00D8BADF00D0...</text>
    <text x="620" y="20"><animate attributeName="y" values="-20;300" dur="4s" repeatCount="indefinite" begin="2s"/>0xFEEDFACECAFEBABE...</text>
  </g>

  <g transform="translate(400,135)">
    <rect x="-310" y="-95" width="620" height="190" rx="6" fill="#0c0c0c" stroke="#222" stroke-width="1"/>
    <rect x="-310" y="-95" width="620" height="24" rx="6" fill="#111"/>
    <rect x="-310" y="-79" width="620" height="10" fill="#111"/>
    <circle cx="-290" cy="-83" r="5" fill="#333"/>
    <circle cx="-270" cy="-83" r="5" fill="#333"/>
    <circle cx="-250" cy="-83" r="5" fill="#333"/>
    <text x="-220" y="-79" font-family="monospace" font-size="10" fill="#444">root@agent-nft:~# deploy</text>

    <text x="-300" y="-50" font-family="monospace" font-size="11" fill="#444">$ cast create2 --starts-with 0x1337 --init-code-hash ...</text>

    <text x="-300" y="-28" font-family="monospace" font-size="11" fill="#0f0">
      <animate attributeName="opacity" values="0;1;1;1;1;1;0" dur="4s" repeatCount="indefinite"/>[+] Mining vanity address: 0x1337a...Found!
    </text>
    <text x="-300" y="-8" font-family="monospace" font-size="11" fill="#0f0">
      <animate attributeName="opacity" values="0;0;1;1;1;1;0" dur="4s" repeatCount="indefinite"/>[+] Deploying AgentIdentityRegistry at 0x1337a2b3...
    </text>
    <text x="-300" y="12" font-family="monospace" font-size="11" fill="#0f0">
      <animate attributeName="opacity" values="0;0;0;1;1;1;0" dur="4s" repeatCount="indefinite"/>[+] Minting Agent #1337 → owner: 0x7a23...
    </text>
    <text x="-300" y="32" font-family="monospace" font-size="11" fill="#0f0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="4s" repeatCount="indefinite"/>[+] TBA deployed: 0x9f8e... via CREATE2 (ERC-6551)
    </text>
    <text x="-300" y="52" font-family="monospace" font-size="11" fill="#0f0">
      <animate attributeName="opacity" values="0;0;0;0;0;1;0" dur="4s" repeatCount="indefinite"/>[+] Memory capsule #0 written to .pixe format
    </text>
    <text x="-300" y="72" font-family="monospace" font-size="11" fill="#0f0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;1" dur="4s" repeatCount="indefinite"/>[+] Agent live at agent.vims.com/1337 — x402 ready
    </text>

    <rect x="-300" y="78" width="8" height="14" fill="#0f0">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(180, -10)">
      <rect x="0" y="-35" width="120" height="90" rx="4" fill="#080808" stroke="#222" stroke-width="1" opacity="0.95"/>
      <text x="60" y="-8" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#0f0" filter="url(#glow6)">AGENT</text>
      <text x="60" y="18" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#0f0" filter="url(#glow6)">NFT</text>
      <text x="60" y="40" text-anchor="middle" font-family="monospace" font-size="11" fill="#444">agent.vims.com</text>
    </g>
  </g>

  <g transform="translate(400, 250)" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">
    <text x="-315" y="0">ERC-721</text>
    <text x="-252" y="0" fill="#0f0">ERC-8004</text>
    <text x="-189" y="0" fill="#0c0">ERC-6551</text>
    <text x="-126" y="0" fill="#0f0">EIP-712</text>
    <text x="-63" y="0" fill="#0c0">EIP-3009</text>
    <text x="0" y="0" fill="#0f0">ERC-2981</text>
    <text x="63" y="0" fill="#0c0">ERC-4337</text>
    <text x="126" y="0" fill="#0f0">x402</text>
    <text x="189" y="0" fill="#0c0">ERC-1271</text>
    <text x="252" y="0" fill="#0f0">.pixe</text>
  </g>

  <line x1="200" y1="268" x2="600" y2="268" stroke="#222" stroke-width="1">
    <animate attributeName="stroke" values="#222;#0f0;#222" dur="6s" repeatCount="indefinite"/>
  </line>
</svg>
