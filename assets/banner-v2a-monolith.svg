<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Ambient blobs -->
  <circle cx="400" cy="100" r="150" fill="#10b981" opacity="0.03" filter="url(#softBlur)">
    <animate attributeName="r" values="150;170;150" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="60" r="80" fill="#3b82f6" opacity="0.02" filter="url(#softBlur)">
    <animate attributeName="cx" values="200;220;200" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- Main text -->
  <text x="400" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="url(#textGrad)" letter-spacing="12">
    AGENT NFT
  </text>
  <!-- Subtle reflection -->
  <text x="400" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#1e293b" opacity="0.15" letter-spacing="12" transform="scale(1,-1) translate(0,-230)">
    AGENT NFT
  </text>
  <!-- URL -->
  <text x="400" y="155" text-anchor="middle" font-family="monospace" font-size="14" fill="#475569" letter-spacing="3">
    agent.vims.com
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </text>
  <!-- Standards as subtle line -->
  <text x="400" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#334155" letter-spacing="2">
    ERC-721 · ERC-8004 · ERC-6551 · EIP-712 · EIP-3009 · ERC-2981 · ERC-4337 · x402 · ERC-1271 · .pixe
  </text>
</svg>
