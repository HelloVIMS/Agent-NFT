<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%">
  <rect width="100%" height="100%" fill="#0a0a0a"/>

  <!-- Very subtle scanline -->
  <g opacity="0.03">
    <line x1="0" y1="40" x2="800" y2="40" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="400" y="78" text-anchor="middle" font-family="monospace" font-size="40" font-weight="700" fill="#f5f5f5" letter-spacing="6">
    AGENT<tspan fill="#10b981">NFT</tspan>
  </text>

  <!-- URL as command -->
  <text x="400" y="108" text-anchor="middle" font-family="monospace" font-size="13" fill="#525252">
    <tspan fill="#10b981">$</tspan> curl -s agent.vims.com
  </text>

  <!-- One-line standard list -->
  <text x="400" y="138" text-anchor="middle" font-family="monospace" font-size="10" fill="#404040" letter-spacing="1">
    ERC-721  ERC-8004  ERC-6551  EIP-712  EIP-3009  ERC-2981  ERC-4337  x402  ERC-1271  .pixe
  </text>

  <!-- Bottom thin line with pulse -->
  <line x1="200" y1="160" x2="600" y2="160" stroke="#262626" stroke-width="1">
    <animate attributeName="stroke" values="#262626;#10b981;#262626" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- Tiny status indicator -->
  <circle cx="400" cy="160" r="2" fill="#10b981">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
