<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%">
  <defs>
    <filter id="glow10"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="#272822"/>

  <g transform="translate(400,135)">
    <rect x="-310" y="-95" width="620" height="190" rx="6" fill="#1e1f1c" stroke="#3e3f3a" stroke-width="1"/>
    <rect x="-310" y="-95" width="620" height="24" rx="6" fill="#151612"/>
    <rect x="-310" y="-79" width="620" height="10" fill="#151612"/>
    <circle cx="-290" cy="-83" r="5" fill="#f92672"/>
    <circle cx="-270" cy="-83" r="5" fill="#fd971f"/>
    <circle cx="-250" cy="-83" r="5" fill="#a6e22e"/>
    <text x="-220" y="-79" font-family="monospace" font-size="10" fill="#75715e">agent-nft — remappings.txt</text>

    <text x="-300" y="-50" font-family="monospace" font-size="11" fill="#75715e">// SPDX-License-Identifier: MIT</text>

    <text x="-300" y="-28" font-family="monospace" font-size="11" fill="#f92672">
      <animate attributeName="opacity" values="0;1;1;1;1;1;0" dur="4s" repeatCount="indefinite"/><tspan fill="#f92672">function</tspan> <tspan fill="#a6e22e">mintAgent</tspan>(<tspan fill="#66d9ef">address</tspan> <tspan fill="#f8f8f2">to</tspan>) <tspan fill="#f92672">external</tspan> <tspan fill="#66d9ef">payable</tspan> {
    </text>
    <text x="-300" y="-8" font-family="monospace" font-size="11" fill="#f8f8f2">
      <animate attributeName="opacity" values="0;0;1;1;1;1;0" dur="4s" repeatCount="indefinite"/>  <tspan fill="#66d9ef">uint256</tspan> <tspan fill="#f8f8f2">tokenId</tspan> = <tspan fill="#f8f8f2">_nextTokenId</tspan>++;
    </text>
    <text x="-300" y="12" font-family="monospace" font-size="11" fill="#f8f8f2">
      <animate attributeName="opacity" values="0;0;0;1;1;1;0" dur="4s" repeatCount="indefinite"/>  <tspan fill="#f8f8f2">_safeMint</tspan>(<tspan fill="#f8f8f2">to</tspan>, <tspan fill="#f8f8f2">tokenId</tspan>);
    </text>
    <text x="-300" y="32" font-family="monospace" font-size="11" fill="#f8f8f2">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="4s" repeatCount="indefinite"/>  <tspan fill="#f8f8f2">tbaRegistry</tspan>.<tspan fill="#a6e22e">createAccount</tspan>(<tspan fill="#f8f8f2">tokenId</tspan>); <tspan fill="#75715e">// ERC-6551</tspan>
    </text>
    <text x="-300" y="52" font-family="monospace" font-size="11" fill="#f8f8f2">
      <animate attributeName="opacity" values="0;0;0;0;0;1;0" dur="4s" repeatCount="indefinite"/>  <tspan fill="#f8f8f2">memory</tspan>.<tspan fill="#a6e22e">initialize</tspan>(<tspan fill="#f8f8f2">tokenId</tspan>); <tspan fill="#75715e">// .pixe genesis</tspan>
    </text>
    <text x="-300" y="72" font-family="monospace" font-size="11" fill="#a6e22e">
      <animate attributeName="opacity" values="0;0;0;0;0;0;1" dur="4s" repeatCount="indefinite"/>  <tspan fill="#f8f8f2">emit</tspan> <tspan fill="#a6e22e">AgentMinted</tspan>(<tspan fill="#f8f8f2">to</tspan>, <tspan fill="#f8f8f2">tokenId</tspan>, <tspan fill="#f8f8f2">block.timestamp</tspan>);
    </text>

    <rect x="-300" y="78" width="8" height="14" fill="#f8f8f2">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(180, -10)">
      <rect x="0" y="-35" width="120" height="90" rx="4" fill="#272822" stroke="#3e3f3a" stroke-width="1" opacity="0.95"/>
      <text x="60" y="-8" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#f8f8f2" filter="url(#glow10)">AGENT</text>
      <text x="60" y="18" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#a6e22e" filter="url(#glow10)">NFT</text>
      <text x="60" y="40" text-anchor="middle" font-family="monospace" font-size="11" fill="#75715e">agent.vims.com</text>
    </g>
  </g>

  <g transform="translate(400, 250)" text-anchor="middle" font-family="monospace" font-size="10" fill="#75715e">
    <text x="-315" y="0">ERC-721</text>
    <text x="-252" y="0" fill="#f8f8f2">ERC-8004</text>
    <text x="-189" y="0" fill="#a6e22e">ERC-6551</text>
    <text x="-126" y="0" fill="#66d9ef">EIP-712</text>
    <text x="-63" y="0" fill="#fd971f">EIP-3009</text>
    <text x="0" y="0" fill="#f92672">ERC-2981</text>
    <text x="63" y="0" fill="#66d9ef">ERC-4337</text>
    <text x="126" y="0" fill="#f8f8f2">x402</text>
    <text x="189" y="0" fill="#a6e22e">ERC-1271</text>
    <text x="252" y="0" fill="#66d9ef">.pixe</text>
  </g>

  <line x1="200" y1="268" x2="600" y2="268" stroke="#3e3f3a" stroke-width="1">
    <animate attributeName="stroke" values="#3e3f3a;#a6e22e;#3e3f3a" dur="6s" repeatCount="indefinite"/>
  </line>
</svg>
