<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%">
  <defs>
    <pattern id="scan3" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.5"/>
    </pattern>
    <filter id="glow3"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="#050a12"/>
  <rect width="100%" height="100%" fill="url(#scan3)"/>

  <g font-family="monospace" font-size="9" fill="#0af" opacity="0.05" text-anchor="middle">
    <text x="100" y="0"><animate attributeName="y" values="-40;320" dur="4s" repeatCount="indefinite"/>0x4a 0x67 0x65 0x6e 0x74</text>
    <text x="700" y="0"><animate attributeName="y" values="-40;320" dur="5s" repeatCount="indefinite" begin="1.5s"/>0xNFT 0xTBA 0xPixe</text>
  </g>

  <g transform="translate(400,135)">
    <rect x="-310" y="-95" width="620" height="190" rx="6" fill="#0a1520" stroke="#0a2a4a" stroke-width="1"/>
    <rect x="-310" y="-95" width="620" height="24" rx="6" fill="#0d1e30"/>
    <rect x="-310" y="-79" width="620" height="10" fill="#0d1e30"/>
    <circle cx="-290" cy="-83" r="5" fill="#ff5f56"/>
    <circle cx="-270" cy="-83" r="5" fill="#ffbd2e"/>
    <circle cx="-250" cy="-83" r="5" fill="#27c93f"/>
    <text x="-220" y="-79" font-family="monospace" font-size="10" fill="#1a4a7a">agent-nft — anvil fork — block 18672341</text>

    <text x="-300" y="-50" font-family="monospace" font-size="11" fill="#1a4a7a">$ cast rpc anvil_mintAgentNFT 0xUser 1</text>

    <text x="-300" y="-28" font-family="monospace" font-size="11" fill="#0af">
      <animate attributeName="opacity" values="0;1;1;1;1;1;0" dur="4s" repeatCount="indefinite"/>[1/5] Deploying AgentIdentityRegistry...
    </text>
    <text x="-300" y="-8" font-family="monospace" font-size="11" fill="#0af">
      <animate attributeName="opacity" values="0;0;1;1;1;1;0" dur="4s" repeatCount="indefinite"/>[2/5] Setting baseURI: agent.vims.com/{tokenId}
    </text>
    <text x="-300" y="12" font-family="monospace" font-size="11" fill="#0af">
      <animate attributeName="opacity" values="0;0;0;1;1;1;0" dur="4s" repeatCount="indefinite"/>[3/5] Minting tokenId 1337 to 0x7a23...
    </text>
    <text x="-300" y="32" font-family="monospace" font-size="11" fill="#0af">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="4s" repeatCount="indefinite"/>[4/5] Deploying ERC-6551 TBA via CREATE2
    </text>
    <text x="-300" y="52" font-family="monospace" font-size="11" fill="#0af">
      <animate attributeName="opacity" values="0;0;0;0;0;1;0" dur="4s" repeatCount="indefinite"/>[5/5] Initializing .pixe memory capsule
    </text>
    <text x="-300" y="72" font-family="monospace" font-size="11" fill="#5df">
      <animate attributeName="opacity" values="0;0;0;0;0;0;1" dur="4s" repeatCount="indefinite"/>✓ Agent #1337 initialized. Ready for x402.
    </text>

    <rect x="-300" y="78" width="8" height="14" fill="#0af">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(180, -10)">
      <rect x="0" y="-35" width="120" height="90" rx="4" fill="#050a12" stroke="#0a2a4a" stroke-width="1" opacity="0.95"/>
      <text x="60" y="-8" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#0af" filter="url(#glow3)">AGENT</text>
      <text x="60" y="18" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#5df" filter="url(#glow3)">NFT</text>
      <text x="60" y="40" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a4a7a">agent.vims.com</text>
    </g>
  </g>

  <g transform="translate(400, 250)" text-anchor="middle" font-family="monospace" font-size="10" fill="#1a4a7a">
    <text x="-315" y="0">ERC-721</text>
    <text x="-252" y="0" fill="#0af">ERC-8004</text>
    <text x="-189" y="0" fill="#5df">ERC-6551</text>
    <text x="-126" y="0" fill="#0af">EIP-712</text>
    <text x="-63" y="0" fill="#5df">EIP-3009</text>
    <text x="0" y="0" fill="#0af">ERC-2981</text>
    <text x="63" y="0" fill="#5df">ERC-4337</text>
    <text x="126" y="0" fill="#0af">x402</text>
    <text x="189" y="0" fill="#5df">ERC-1271</text>
    <text x="252" y="0" fill="#0af">.pixe</text>
  </g>

  <line x1="200" y1="268" x2="600" y2="268" stroke="#0a2a4a" stroke-width="1">
    <animate attributeName="stroke" values="#0a2a4a;#0af;#0a2a4a" dur="6s" repeatCount="indefinite"/>
  </line>
</svg>
