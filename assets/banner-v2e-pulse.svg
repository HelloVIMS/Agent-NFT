<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Soundwave bars behind text -->
  <g transform="translate(400,130)" opacity="0.15">
    <rect x="-200" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="40;120;40" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-60;-20" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-180" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="80;40;80" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="y" values="-20;-20;-20" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
    </rect>
    <rect x="-160" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="60;100;60" dur="1.1s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="y" values="-30;-50;-30" dur="1.1s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
    <rect x="-140" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="100;50;100" dur="1.3s" repeatCount="indefinite" begin="0.1s"/>
      <animate attributeName="y" values="-50;-25;-50" dur="1.3s" repeatCount="indefinite" begin="0.1s"/>
    </rect>
    <rect x="-120" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="50;90;50" dur="1.4s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="y" values="-25;-45;-25" dur="1.4s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <rect x="-100" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="90;60;90" dur="1.6s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="y" values="-45;-30;-45" dur="1.6s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
    <rect x="-80" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="70;110;70" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="y" values="-35;-55;-35" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
    </rect>

    <rect x="80" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="70;110;70" dur="1.2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="y" values="-35;-55;-35" dur="1.2s" repeatCount="indefinite" begin="0.7s"/>
    </rect>
    <rect x="100" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="90;60;90" dur="1.6s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="y" values="-45;-30;-45" dur="1.6s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
    <rect x="120" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="50;90;50" dur="1.4s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="y" values="-25;-45;-25" dur="1.4s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <rect x="140" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="100;50;100" dur="1.3s" repeatCount="indefinite" begin="0.1s"/>
      <animate attributeName="y" values="-50;-25;-50" dur="1.3s" repeatCount="indefinite" begin="0.1s"/>
    </rect>
    <rect x="160" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="60;100;60" dur="1.1s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="y" values="-30;-50;-30" dur="1.1s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
    <rect x="180" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="80;40;80" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="y" values="-20;-20;-20" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
    </rect>
    <rect x="200" y="-60" width="6" height="120" fill="url(#barGrad)" rx="3">
      <animate attributeName="height" values="40;120;40" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-60;-20" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Title -->
  <text x="400" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="#f5f5f5" letter-spacing="8">
    AGENT<tspan fill="#10b981">NFT</tspan>
  </text>

  <!-- URL -->
  <text x="400" y="148" text-anchor="middle" font-family="monospace" font-size="13" fill="#525252" letter-spacing="3">
    agent.vims.com
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Standards as tiny equalizer dots -->
  <g transform="translate(400, 190)" text-anchor="middle">
    <text font-family="monospace" font-size="10" fill="#404040" letter-spacing="2">
      ERC-721  ·  ERC-8004  ·  ERC-6551  ·  EIP-712  ·  EIP-3009  ·  ERC-2981  ·  ERC-4337  ·  x402
    </text>
  </g>

  <!-- Bottom live indicator -->
  <g transform="translate(400, 230)">
    <circle cx="-40" cy="0" r="3" fill="#10b981">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-20" y="4" font-family="monospace" font-size="10" fill="#404040">LIVE</text>
    <text x="20" y="4" font-family="monospace" font-size="10" fill="#2a2a2a">0x402 SETTLEMENT READY</text>
  </g>
</svg>
